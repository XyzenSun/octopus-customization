                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: ShouldBindJSON 解析或类型绑定失败, message 为 Invalid JSON format. 缺少普通属性不因 required 标签报错.
          content:
            application/json:
              schema:
