        description: JSON 请求体. 属性可以省略, 但空 body 会导致解析错误. Go 标量对 JSON null 的解析较宽松, 可能保留零值, 这里不将 null 建模为标量的规范输入类型. 没有用户名, 密码长度或 expire 范围的 binding 校验.
      security: []
