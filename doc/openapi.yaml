  /api/v1/user/login:
    post:
      operationId: loginUser
      summary: 管理员登录
      description: '公开接口. RequireJSON 要求 Content-Type 包含大小写敏感的 application/json, 不符合时返回 415. 使用 ShouldBindJSON 解析请求, 请求字段均无 binding required. 先验证当前缓存中的用户名和 bcrypt 密码, 再验证 TOTP. 未启用两步验证时忽略 code. 启用时, 密码正确但验证码失败计入全局内存计数, 5 次失败后锁定 5 分钟. 密码错误, 验证码错误和锁定均返回相同的 401, 不在响应中区分原因. expire 实际单位为分钟: 0 使用 15 分钟, 正数使用对应分钟数, -1 使用 30 天. expire 小于 -1 时未设置 ExpiresAt, 后续 Format 存在 nil 解引用路径, 可能由全局 recovery 返回 500. 极大正数直接乘 time.Minute 可能发生 duration 溢出, 200 签发响应不保证 JWT 尚未过期. JWT 使用当前用户名与密码哈希拼接作为签名 secret. 不保证运行服务已经启用两步验证. 源码: internal/server/handlers/user.go:59-85, internal/server/auth/auth.go:13-43, internal/op/twofactor.go:155-183.'
