  /v1/chat/completions:
    post:
      operationId: relayChatCompletions
      summary: 转发 OpenAI Chat Completions 请求
      description: '入站及客户端响应协议固定为 OpenAI Chat Completions, 与鉴权头无关. 非空 x-api-key 优先于 Authorization, Key 必须属于 Octopus 且启用, 未过期, 累计成本未超过 max_cost. RequireJSON 只检查 Content-Type 包含小写 application/json, 解析后要求非空 model 和非空 messages. 可选择 openai/chat_completions, openai/responses, anthropic/messages, gemini/contents 或 doubao 出站, 普通转换不承诺全部官方或扩展字段无损. stream:true 使用 SSE, 首事件超时只应用于配置了正 first_token_time_out 的 Group, 已写出响应后不重试或追加 JSON 错误. 完整 model 优先精确匹配 Group, Group 存在但无启用候选时返回 503 且不回退. Group 不存在且 model 包含 / 时按第一个 / 解析 channelName/modelName, 严格区分大小写且选路不 trim, 只使用渠道 Model/CustomModel 当前快照. supported_models 非空时禁止实际直连, 正常 Group 白名单按逗号拆分但不 trim, 与 /v1/models 的 trim 行为不同. 直连仅尝试指定渠道一次, 不使用负载均衡, 故障转移, sticky, Group 首事件超时或 Group 请求选项, 仍检查渠道启用, 可用 Key, 有效 BaseURL 和熔断. 分组请求选项先应用, 渠道后覆盖, JSON 顶层 null 删除参数, 自定义 Header 可覆盖或删除认证头. 协议直通另需 passthrough_enabled, 入站与渠道 Type 完全相同, 无适用请求选项且 endpoint 有效, 仍先解析和选路, 可改写 JSON model, 不等同于指定渠道直连. 非流式直通保留原始成功 body, status 和 Header. 流式直通保留解析后的 data 和 event/id, 由 Octopus 重新编码 SSE 并使用本地响应头与 200 状态, 不保证原始字节或全部上游 Header. endpoint 直接拼 BaseURL, 不做普通版本规范化. 本地错误及分组全部失败返回 ErrorResponse, 分组最终失败为 502. 仅指定渠道直连的可识别上游 HTTP 错误保留状态并转换为 OpenAIProtocolError, 无上游 HTTP 状态的真实尝试失败为 502, 不可用或跳过为 503. 流已提交后的错误及客户端取消不保证另有错误 JSON. Group 路由按 mode 排序候选并在配置允许时让可用 sticky 渠道优先, 尚未写出响应时可顺次尝试或故障转移. 尝试结果记录于 RelayLog.Attempts 并统计, 日志持久化受设置影响. Authorization 通常使用 Bearer <key>, 实现也接受直接 key, 仅剥离精确的 Bearer 加一个空格, 不额外 trim 或读取 Cookie/query 凭证. 来源: internal/server/server.go:59, internal/relay/relay.go:42-177,287-603, internal/relay/direct_channel.go:26-117, internal/relay/passthrough.go:37-176.'
      parameters: []
      responses:
        '200':
          description: 普通转换的非流式 JSON 或 stream:true 的 SSE, 无管理包装. 非流式直通可能保留其他 JSON, Content-Type 或空 body.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OpenAIChatResponse'
                  - $ref: '#/components/schemas/PassthroughJSON'
            '*/*':
              schema:
                $ref: '#/components/schemas/PassthroughBody'
            text/event-stream:
              schema:
                type: string
                description: SSE 文本. data 通常是 Chat Completions chunk JSON, 可含 [DONE]. 不把整段流声明为 JSON 数组.
          headers:
            Cache-Control:
              description: SSE 时为 no-cache
              schema:
                type: string
            Connection:
              description: SSE 时为 keep-alive
              schema:
                type: string
            X-Accel-Buffering:
              description: SSE 时为 no
              schema:
                type: string
        '400':
          description: 本地入站校验或模型白名单失败, 或指定渠道上游 HTTP 400
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '401':
          description: Octopus API Key 缺失, 无效, 禁用, 过期或超成本, 或指定渠道上游 HTTP 401
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '404':
          description: 本地模型或直连渠道不存在, 或指定渠道上游 HTTP 404
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '415':
          description: RequireJSON 拒绝 Content-Type, 或指定渠道上游 HTTP 415
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '500':
          description: 本地请求体读取, 解压, 非校验转换或 recovery 失败, 或指定渠道上游 HTTP 500
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '502':
          description: 分组最终失败, 直连网络或转换等真实尝试失败, 或指定渠道上游 HTTP 502
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '503':
          description: 无启用候选, 直连渠道禁用, 无可用 Key, 无有效 BaseURL, 不兼容或熔断, 或指定渠道上游 HTTP 503
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        default:
          description: '其他上游状态. 不一概表示错误: 协议直通可保留非 200 成功状态, body 和 Content-Type. 指定渠道可返回其他上游 HTTP 错误状态及转换后的协议错误体. 普通转换通常生成 200. SSE 提交后的流错误不按此另发响应.'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OpenAIChatResponse'
                  - $ref: '#/components/schemas/PassthroughJSON'
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
            '*/*':
              schema:
                description: 协议直通可能保留未建模的成功 body, 包括空 body 或非 JSON 内容.
      tags:
        - Relay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatRequest'
      security:
        - APIKeyHeader: []
        - APIKeyBearer: []
  /v1/embeddings:
    post:
      operationId: relayEmbeddings
      summary: 转发 OpenAI Embeddings 请求
      description: '入站及客户端响应固定为 OpenAI Embeddings, 与鉴权头无关. 非空 x-api-key 优先于 Authorization, Key 必须属于 Octopus 且启用, 未过期, 累计成本未超过 max_cost. RequireJSON 只检查 Content-Type 包含小写 application/json. model 必须非空, input 支持 string, string[], token 整数数组或二维 token 数组, 并执行非空校验. 不提供 stream 或正式 SSE 响应路径, 转换路径不识别 stream 字段. 可选择 openai/chat_completions, openai/responses, openai/embeddings, gemini/contents 或 doubao. OpenAI 类渠道实际走 /embeddings, openai/responses 渠道此时也不是 Responses API. Gemini 走 embedContent 或 batchEmbedContents 且仅转换文本, token 数组失败. Doubao 走 /embeddings/multimodal, 当前入站只提供上述文本或 token 类型, 出站只构造文本项, 不承诺 token 输入或多模态兼容. 完整 model 优先精确命中 Group, 存在但无启用候选时 503 且不回退. 不存在且含 / 时按第一个 / 拆 channelName/modelName, 大小写严格且选路不 trim, 只检查渠道 Model/CustomModel 当前快照. supported_models 非空禁止实际直连, Group 白名单按逗号拆分不 trim, 与 /v1/models 的 trim 不同. 直连一次指定渠道尝试, 不用负载均衡, 故障转移, sticky, Group 超时或 Group 请求选项, 仍检查启用, Key, BaseURL 和熔断. Group 请求选项先应用, 渠道后覆盖, 仅 JSON 顶层合并参数, null 删除, Header 可覆盖或删除认证. 协议直通需开关, 相同入站和渠道 Type, 无适用请求选项且 endpoint 有效, 仍先解析和选路, 可改 JSON model, 不等同直连. 直通保留原始成功 body, status 和 Header, endpoint 直接拼 BaseURL, 未做普通版本规范化. 即使原始 body 带 stream 扩展, 也不因此形成正式 SSE 支持. 本地错误及分组最终失败为 ErrorResponse, 分组最终失败为 502. 仅直连可识别的上游 HTTP 错误保留状态并转为 OpenAIProtocolError, 无 HTTP 状态的真实尝试失败为 502, 不可用或跳过为 503. Group 路由按 mode 排序候选并在配置允许时让可用 sticky 渠道优先, 尚未写出响应时可顺次尝试或故障转移. 尝试结果记录于 RelayLog.Attempts 并统计, 日志持久化受设置影响. Authorization 通常使用 Bearer <key>, 实现也接受直接 key, 仅剥离精确的 Bearer 加一个空格, 不额外 trim 或读取 Cookie/query 凭证. 来源: internal/server/server.go:62, internal/relay/relay.go:42-177, internal/relay/transformers.go:49-60, axonhub pin d061ac7df6ae transformer/openai/embedding_inbound.go, transformer/gemini/embedding.go, transformer/doubao/embedding.go.'
      parameters: []
      responses:
        '200':
          description: 普通转换的非流式 Embeddings JSON, 无管理包装. 非流式直通可能保留其他 JSON, Content-Type 或空 body.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OpenAIEmbeddingResponse'
                  - $ref: '#/components/schemas/PassthroughJSON'
            '*/*':
              schema:
                $ref: '#/components/schemas/PassthroughBody'
        '400':
          description: 本地解析, model, input 或白名单校验失败, 或指定渠道上游 HTTP 400
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '401':
          description: Octopus API Key 缺失, 无效, 禁用, 过期或超成本, 或指定渠道上游 HTTP 401
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '404':
          description: 本地模型或直连渠道不存在, 或指定渠道上游 HTTP 404
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '415':
          description: RequireJSON 拒绝 Content-Type, 或指定渠道上游 HTTP 415
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '500':
          description: 本地读取, 解压, 非校验转换或 recovery 失败, 或指定渠道上游 HTTP 500
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '502':
          description: 分组最终失败, 直连网络或转换等真实尝试失败, 或指定渠道上游 HTTP 502
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '503':
          description: 无启用候选或直连目标不可用, 不兼容, 熔断, 或指定渠道上游 HTTP 503
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        default:
          description: 其他上游状态, 包括协议直通保留的非 200 成功状态和指定渠道其他 HTTP 错误, 不一概表示错误. 不据此声明 embedding 支持 SSE.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OpenAIEmbeddingResponse'
                  - $ref: '#/components/schemas/PassthroughJSON'
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
            '*/*':
              schema:
                description: 直通成功可以保留原始或空 body 及其他 Content-Type.
      tags:
        - Relay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIEmbeddingRequest'
      security:
        - APIKeyHeader: []
        - APIKeyBearer: []
