                  - $ref: '#/components/schemas/PassthroughJSON'
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
            '*/*':
              schema:
                description: 直通成功可以保留原始或空 body 及其他 Content-Type.
