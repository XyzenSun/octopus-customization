      description: '继承根级 JWTAuth. Auth 先于 RequireJSON 执行. 直接绑定 Channel 实体, 属性无 binding required, 不查找已保存渠道, 也不执行 create/update 的 param_override 校验. helper 按代理配置创建 HTTP client, 从 base_urls 选择非空且 delay 最低的地址, 从已启用且非空的 key 中按成本和可选 Key 熔断规则选择 key. Anthropic 和 Gemini 使用各自模型接口和分页, 空结果可回退 OpenAI, 其他协议包括未知值走默认 OpenAI 分支, Doubao 使用 v3 路径. 非空 match_regex 在获取后编译并过滤模型. 远端响应直接 JSON decode, 不按上游 HTTP 状态码判断失败, 所以成功包装不保证上游 HTTP 成功. 不对 channel.enabled 做检查. 此操作会访问远端, 不持久化传入渠道. RequireJSON 失败返回 415. 源码: internal/server/handlers/channel.go:157-169, internal/helper/fetch.go:16-199, internal/model/channel.go:95-178.'
