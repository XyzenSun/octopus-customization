      description: '继承根级 JWTAuth. Auth 先于 RequireJSON 执行. 请求无 binding required, op 先验证旧密码, 再 bcrypt 哈希新密码并更新数据库. 没有显式的新密码非空, 最小长度或复杂度规则. 旧密码错误, 哈希失败和数据库失败均映射为 500 Database operation failed, 不是 400 或 401. 成功后当前密码哈希变化, 后续 JWT 校验使用的新 secret 会使旧 JWT 失效. op 在数据库更新前修改用户缓存, 失败路径也不能保证缓存状态不变. RequireJSON 失败返回 415. 源码: internal/server/handlers/user.go:87-98, internal/op/user.go:29-43, internal/server/auth/auth.go:36-43.'
