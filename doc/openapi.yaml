  /api/v1/channel/test-model:
    post:
      operationId: testChannelModel
      summary: 对渠道单个模型执行即时调用探测
      description: '继承根级 JWTAuth. Auth 先于 RequireJSON 执行. model 有 binding required. 来源规则按实际 hasID 计算: channel_id 非 null 且大于 0 才是有效 ID 来源, channel 非 null 才是临时对象来源. 必须恰有一个有效来源. 正 channel_id 与非 null channel 同时提供会失败, 但 channel_id 为 0 或负数并带 channel 会走临时渠道, 不能虚构为按属性是否出现的严格互斥. ID 来源从缓存读取渠道, 任何读取错误都映射为 404. key_index 是 keys 数组下标, 默认 0, 必须非负且小于长度. 请求 model 不做 trim, 必须精确属于渠道 model 与 custom_model 经拆分, trim, 去空后的集合. helper 还要求有效 base URL 和 trim 后非空的所选 key, 拒绝 embedding 和未支持的协议. 不检查渠道 enabled 或所选 key enabled. 固定 prompt 为 translate `octopus` to Español, 固定最大输出 token 为 1024, 不使用传入 param_override, 但会应用 custom_header. 不走 relay 的重试, 熔断或统计, 结果不持久化. timeout_ms 非正值使用 30000ms, 正数转为 duration 后大于 5 分钟则钳制为 300000ms, 无转换前整数上限校验, 极大值存在 duration 乘法溢出风险. HTTP client 可执行默认重定向, 本接口的单次探测不等于保证只有一个网络 HTTP 请求. 网络, DNS, 超时或上游错误通常仍以 HTTP 200 返回 TestModelResult. RequireJSON 失败返回 415. 源码: internal/server/handlers/channel_model_probe.go:32-110, internal/helper/test_model.go:20-117,120-210.'
      parameters: []
      responses:
        '200':
          description: 探测已生成结果, 不等于模型调用成功. 网络错误或超时通常 status_code 为 0, 上游响应码存于 data.status_code, 不直接用作管理接口 HTTP 状态.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TestModelResult'
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: 缺少 Authorization, JSON/model required 绑定失败, 有效来源不满足恰有一个, key_index 越界, model 不在所选集合, 空 base URL, 空 key, embedding 或不支持的协议, 请求构造或 HTTP client 构造错误. 绑定失败返回 Invalid JSON format, 其他错误返回具体手动校验或 helper 文本.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 有效正 channel_id 的 ChannelGet 返回任何错误, message 统一为 channel not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type 未包含大小写敏感的 application/json 子串. RequireJSON 不检查 JSON 内容; 语法错误由接口解析处理. 有鉴权的路由先执行鉴权, 公开登录不要求先认证.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 接口内部错误或全局 panic recovery. 错误原因以 message 为准, 当前实现可能将资源不存在等错误映射为 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelTestModelRequest'
        description: 即时探测请求. 来源条件完整记录在 schema description, 不使用会错误拒绝 0/负 channel_id 与临时对象组合的属性级 oneOf.
  /api/v1/channel/update:
    post:
      operationId: updateChannel
      summary: 增量更新渠道及密钥
      description: '继承根级 JWTAuth. Auth 先于 RequireJSON 执行. 顶层 id 有 binding required, 表达非零而不是正数. 可选指针属性仅在非 nil 时更新, 省略和 JSON null 都不更新, false, 0, 空字符串或空数组可显式提交. 因而 param_override:null, channel_proxy:null 和 match_regex:null 不能清成数据库 NULL. 与 create 相同地手动校验非空 param_override 字符串, 但不校验 match_regex, 协议或 auto_group 枚举范围. key 删除和更新通过 channel_id 限定所属渠道, 不检查 RowsAffected, 无匹配项可能无操作而成功. key 更新只写非 nil 指针, 可显式将 channel_key 设为空字符串. 密钥操作切片没有 binding dive, 元素 required 标签是否由项目准确版本 validator 执行未确认, op 没有补充逐项 required 校验. 事务提交后刷新缓存, 返回含 stats 的渠道, 再启动与 create 相同的价格, 延迟和自动分组 goroutine. 提交后的缓存刷新错误或后台失败不等于数据库未修改. RequireJSON 失败返回 415. 源码: internal/server/handlers/channel.go:100-126, internal/model/channel.go:61-92, internal/op/channel.go:110-248.'
      parameters: []
      responses:
