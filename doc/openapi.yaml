        description: multipart 文件和文本字段. 标准形式为 multipart/form-data; boundary=..., 解析器也接受其他 multipart/ MIME, 必须有有效 boundary.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageEditRequest'
            encoding:
