  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <jwt>. 当前实现也将裸 JWT 交给校验, 仅删除精确的 Bearer 前缀, 不做大小写或空白归一化. 缺少 Authorization 返回 400, 非空但校验失败返回 401. 修改用户名或密码会改变签名材料, 已签发 Token 随之失效.'
      bearerFormat: JWT
    APIKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Octopus API Key, 前缀为 sk-octopus-. 非空 x-api-key 优先于 Authorization, 失败不会回退. 在 /v1/models 中使用该头选择 Anthropic 列表, 其他 /v1 路由的入站协议由路径固定. 未知, 禁用, 过期或累计成本超过正 max_cost 的 Key 返回 401; 成本等于上限时仍放行.
    APIKeyBearer:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <api_key>. 当前实现也接受裸 Key, 仅删除精确的 Bearer 前缀. 非空 x-api-key 会覆盖此头. 在 /v1/models 中使用 Authorization 选择 OpenAI 列表. Key 无效, 禁用, 过期或累计成本超过正 max_cost 时返回 401.'
      bearerFormat: Octopus API Key
    StreamToken:
      type: apiKey
      in: query
      name: token
      description: 通过 /api/v1/log/stream-token 申请的 64 位小写十六进制 Token. 保存在进程内存, 无 TTL, 不绑定用户, IP 或原 JWT 的过期时间. 连接校验后吊销, 校验与吊销分离, 并发下不保证原子一次性消费. 缺失或无效返回 401.
servers:
  - url: http://127.0.0.1:8080
    description: 默认本机 API 地址示例. 调试前确认实际部署地址, 凭证和授权; 文档预览端口不提供 API 代理.
    variables: {}
