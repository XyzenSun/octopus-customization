                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '500':
          description: 本地读取, 解压, 非校验转换或 recovery 失败, 或指定渠道上游 HTTP 500
          content:
