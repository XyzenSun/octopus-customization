  /api/v1/setting/export:
    get:
      operationId: exportDatabase
      summary: 导出数据库数据
      description: '成功直接返回 DBDump JSON 文件, 不使用统一响应包装. 逐表查询数据库, 不先 flush 日志, 统计或 ChannelKey 运行缓存, 没有导出事务, 不是原子或完整运行态快照. 不包含用户, 密码, 2FA 密钥, 迁移表或启动配置, settings 过滤 two_factor_enabled. Channel 和 Group 查询不 Preload 关联, 密钥和分组项分别位于顶层 channel_keys 和 group_items. 导出内容可能包含明文渠道密钥和 API Key, 应作为敏感备份保管. include_stats 导出的小时表是滚动数据库表, 不是 /stats/hourly 的今天补零结果. Source: internal/server/handlers/setting.go:90-102; internal/op/backup.go:16-76,213-221.'
      parameters:
        - name: include_logs
          in: query
          description: 缺失默认 false. strconv.ParseBool 接受 1, t, T, TRUE, true, True 和 0, f, F, FALSE, false, False. 其他文本或空值解析失败后被忽略, 结果为 false, 不返回 400.
          schema:
            type: string
            default: 'false'
        - name: include_stats
          in: query
          description: 缺失默认 false. 接受 strconv.ParseBool 的 1/0, t/f, T/F, TRUE/FALSE, true/false, True/False, 不是任意大小写组合. 非法或空文本回退 false, 不返回 400.
          schema:
            type: string
            default: 'false'
      responses:
        '200':
          description: 裸 DBDump JSON 下载. 文件名时间使用本地时间, exported_at 使用 UTC.
          headers:
            Content-Disposition:
              description: attachment; filename="octopus-export-YYYYMMDDhhmmss.json".
              schema:
                type: string
              example: attachment; filename="octopus-export-20260102030405.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBDump'
        '400':
          description: Authorization 缺失或为空. HTTP 400, message 为 Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
