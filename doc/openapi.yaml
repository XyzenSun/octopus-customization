openapi: 3.1.0
info:
  title: Octopus HTTP API
  version: 1.0.0
  description: |-
    doc/typespec/*.tsp 是 Octopus HTTP 接口的唯一维护契约, 本 OpenAPI 文件由 TypeSpec 生成, 替代已废弃的 doc/API.md. version 表示文档版本, 运行程序版本通过 /api/v1/update/now-version 查询.

    契约依据当前 Go 路由, handler, model, op 和 go.mod 固定的 axonhub/llm 实现编写, 覆盖 60 个显式业务接口. 管理接口通常使用 /api/v1 前缀, LLM 兼容接口使用 /v1 前缀. 静态资源, CORS, 框架重定向和未匹配路由不在本契约范围内.

    管理成功响应包含 code: 200 和 message: success. 有业务载荷时包含 data, resp.Success(c, nil) 时省略 data. 有类型的空切片可能序列化为 null 或 [], 应按各接口 schema 判断. 本地错误使用 code 和 message, code 等于 HTTP 状态码. 指定渠道直连的特定上游 HTTP 错误按入站协议转换, 分组路由最终失败使用 Octopus 错误包装.

    分组路由先精确匹配完整请求模型. 分组不存在时, 可按第一个 / 将请求模型解析为 channelName/modelName, 执行一次指定渠道直连. 非空 supported_models 限制的 API Key 不允许指定渠道直连. 协议直通是协议一致时的转发优化, 保留原始协议扩展, 仍遵循选路和鉴权. 分组请求选项先应用, 渠道请求选项随后覆盖; 指定渠道直连只应用渠道请求选项.

    本契约记录现有行为, 不承诺数据库标签对应 HTTP 校验, 也不承诺所有上游扩展字段或跨协议能力无损兼容. 请求 schema 保持未知属性开放; schema 的类型表达不覆盖 Go 对 null 的全部宽松解析行为. 注明的实现风险尚未修复. 已进行源码静态审查, 未调用真实 API, 未验证数据库驱动差异, 运行配置或上游能力. Scalar 预览和 OpenAPI 校验不构成运行时验证.
tags:
  - name: User
    description: 用户登录, 账号管理, 服务器时间与双重认证.
  - name: Channel
    description: 渠道管理, 模型探测与同步.
  - name: Group
    description: 分组路由与请求选项管理.
  - name: APIKey
    description: 终端用户 API Key 与当前 Key 的统计.
  - name: Log
    description: 转发日志查询, 清理和 SSE 推送.
  - name: Setting
    description: 运行期设置与数据库表导入, 导出.
  - name: Circuit
    description: 渠道级内存熔断状态与重置.
  - name: Model
    description: 模型价格, 渠道模型视图和兼容模型列表.
  - name: Stats
    description: 累计, 按日, 按小时与 API Key 统计.
  - name: Update
    description: 程序版本检查和二进制自更新.
  - name: Relay
    description: LLM 分组路由, 指定渠道直连与入站协议转换.
paths:
  /api/v1/apikey/create:
    post:
      operationId: createApiKey
      summary: 创建 API Key
      description: '继承根级 JWTAuth. Auth 先于 RequireJSON 执行. ShouldBindJSON 绑定 APIKey 实体, 没有 binding required 或 name 非空, 额度非负, 过期时间范围, supported_models 格式手动校验. handler 用 GenerateAPIKey 覆盖提交的 api_key, 生成格式为 sk- 加 APP_NAME 和 48 个随机字母数字. 随机源错误时生成函数返回空字符串, handler 没有额外检查, 因此不将非空或格式 pattern 作为响应的绝对保证. op 直接 Create 并更新缓存. GORM enabled default:true 不等于已经证实的请求默认值. 返回实际生成的 api_key, 不脱敏. RequireJSON 失败返回 415. 源码: internal/server/handlers/apikey.go:50-62, internal/server/auth/auth.go:48-61, internal/op/apikey.go:15-21.'
      parameters: []
      responses:
        '200':
          description: 创建后的 APIKey, 包含未脱敏的生成密钥. omitempty 属性的零值可能省略.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/APIKey'
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: 缺少 Authorization 时返回 Invalid request parameters. JSON 绑定失败返回 Invalid JSON format, 缺少普通属性不触发 required 错误.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type 未包含大小写敏感的 application/json 子串. RequireJSON 不检查 JSON 内容; 语法错误由接口解析处理. 有鉴权的路由先执行鉴权, 公开登录不要求先认证.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: APIKeyCreate 的数据库写入错误返回 op 包装后的错误文本. 全局 recovery 也可能返回 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - APIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyInput'
        description: APIKey 实体 JSON. 所有属性可在解析层省略, api_key 无论是否提供都会被覆盖. 标量 JSON null 可能保留 Go 零值, 不作为规范标量类型扩展.
  /api/v1/apikey/delete/{id}:
    delete:
      operationId: deleteApiKey
      summary: 删除 API Key 及其统计
      description: '继承根级 JWTAuth. RequireJSON 对 DELETE 放行, 不要求 Content-Type 或 body. id 使用 strconv.Atoi, 无正数校验. op 先调用 StatsAPIKeyDel, 再删除 APIKey, 检查删除 RowsAffected, 最后清理缓存和密钥索引. 这些步骤不在同一事务中, 错误响应不保证此前统计删除没有发生. 成功省略 data, 不是 data:null. 源码: internal/server/handlers/apikey.go:86-98, internal/op/apikey.go:61-79.'
      parameters:
        - name: id
          in: path
          required: true
          description: API Key ID. 必须能转换为 Go int, 没有正数范围约束.
          schema:
            type: integer
      responses:
        '200':
          description: APIKey 删除成功, 响应省略 data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          description: 缺少 Authorization 时返回 Invalid request parameters. id 转换失败返回 Invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 删除统计失败, APIKey 删除 RowsAffected 为 0 时返回 API key not found, 或数据库删除错误. 没有不存在时的 404 分支. 全局 recovery 也可能返回 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - APIKey
  /api/v1/apikey/list:
    get:
      operationId: listApiKeys
      summary: 获取 API Key 列表
      description: '继承根级 JWTAuth. RequireJSON 对 GET 放行, 不要求 Content-Type, 不解析 body 或分页参数. 从内存缓存返回 APIKey, 不脱敏 api_key. 当前 op 初始化非 nil 切片, 无记录返回空数组, 没有排序保证. handler 保留 500 错误分支, 当前 APIKeyList 不返回 error. 源码: internal/server/handlers/apikey.go:64-71, internal/op/apikey.go:37-43.'
      parameters: []
      responses:
        '200':
          description: APIKey 数组, 密钥原样输出, 零值 omitempty 属性省略.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: Authorization 缺失或为空. HTTP 400, message 为 Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 接口内部错误或全局 panic recovery. 错误原因以 message 为准, 当前实现可能将资源不存在等错误映射为 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - APIKey
  /api/v1/apikey/login:
    get:
      operationId: probeApiKeyLogin
      summary: 探测 API Key 登录可用性
      description: '覆盖根级 JWTAuth, 接受 x-api-key 或 Authorization API Key, 非空 x-api-key 优先. 不使用 RequireJSON, 不解析 body 或 query. handler 只在 APIKeyAuth 通过后返回空成功包装. 鉴权仍检查前缀, 缓存存在, enabled, 正 expire_at 是否已过期及正 max_cost 是否小于累计 input_cost+output_cost. 等于额度上限仍放行. 不是只检查密钥字符串是否存在. APIKeyAuth 调用 StatsAPIKeyGet, 缓存未命中可建立零值统计并标记待持久化. 成功省略 data, 不是 data:null. 源码: internal/server/handlers/apikey.go:38-47,132-134, internal/server/middleware/auth.go:32-81, internal/op/stats.go:377-393.'
      parameters: []
      responses:
        '200':
          description: API Key 鉴权通过, 响应省略 data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '401':
          description: 缺少密钥, 前缀错误, 缓存未找到时返回 Authentication failed. 禁用, 已过期或超过正额度上限分别返回对应 API Key 错误文本. 没有管理 JWT 缺头的 400 分支.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 接口内部错误或全局 panic recovery. 错误原因以 message 为准, 当前实现可能将资源不存在等错误映射为 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - APIKey
      security:
        - APIKeyHeader: []
        - APIKeyBearer: []
  /api/v1/apikey/stats:
    get:
      operationId: getCurrentApiKeyStats
      summary: 获取当前 API Key 统计及展示信息
      description: '覆盖根级 JWTAuth, 接受 x-api-key 或 Authorization API Key. 非空 x-api-key 优先, 否则仅从 Authorization 删除精确 Bearer 前缀, 原始密钥也会被交给验证. 鉴权要求正确 sk-APP_NAME- 前缀, 缓存存在且 enabled. expire_at>0 且小于当前 Unix 秒时拒绝, max_cost>0 且小于 input_cost+output_cost 时拒绝, 等于额度上限仍放行. 这些拒绝均为 401. 不使用 RequireJSON, 不解析 query/body, 当前 ID 取自鉴权上下文. StatsAPIKeyGet 缓存未命中时创建零值统计并标记待持久化. info 含未脱敏 api_key, 但 supported_models 不是原样持久化字段: 原配置为空时显示所有 Group 名称, 非空时按逗号拆分并 trim 后与 Group 名称取精确交集, 再用逗号加空格拼接. 结果为空时该属性因 omitempty 省略. 这里无正则支持, 展示过滤的 trim 不等于 relay 校验也 trim. 源码: internal/server/handlers/apikey.go:100-130, internal/server/middleware/auth.go:32-81, internal/op/stats.go:377-393, internal/relay/relay.go:97-105.'
      parameters: []
      responses:
        '200':
          description: 当前密钥统计和展示信息. info.supported_models 经过分组名称过滤改写, 不是原始限制字符串.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/APIKeyStatsResponse'
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '401':
          description: 缺少密钥, 前缀错误, 缓存未找到时返回 Authentication failed. 禁用返回 API key is disabled, 过期返回 API key has expired, 超出正额度上限返回 API key has reached the max cost. 没有管理 JWT 缺头的 400 分支.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 鉴权后读取 APIKey 信息失败或 GroupListModel 失败返回对应错误文本, 当前 GroupListModel 实现不返回 error. 全局 recovery 也可能返回 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - APIKey
      security:
        - APIKeyHeader: []
        - APIKeyBearer: []
  /api/v1/apikey/update:
    post:
      operationId: updateApiKey
      summary: 完整替换 API Key 配置并保留密钥
      description: '继承根级 JWTAuth. Auth 先于 RequireJSON 执行. 直接绑定 APIKey 实体, id 没有 binding required, 不添加 schema required. op 按 id 查缓存, 0, 缺失或不存在通常返回 500 API key not found, 不是 required 400. 使用 Omit(api_key).Save(key), 因此这不是增量更新: name, enabled, expire_at, max_cost 和 supported_models 省略后得到的零值会参与完整保存, 不保留旧值. 提交 api_key 不会改动持久化密钥, op 将原密钥恢复到响应和缓存. 没有字段范围或 supported_models 格式手动校验. RequireJSON 失败返回 415. 源码: internal/server/handlers/apikey.go:73-84, internal/op/apikey.go:24-34.'
      parameters: []
      responses:
        '200':
          description: 保存后的 APIKey, api_key 为原密钥, 零值 omitempty 属性省略.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/APIKey'
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: 缺少 Authorization 时返回 Invalid request parameters. JSON 绑定失败返回 Invalid JSON format. id 缺失或 0 不会因 binding required 返回 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type 未包含大小写敏感的 application/json 子串. RequireJSON 不检查 JSON 内容; 语法错误由接口解析处理. 有鉴权的路由先执行鉴权, 公开登录不要求先认证.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 缓存未找到目标 id 时返回 API key not found. Save 失败返回 failed to update API key 包装的错误文本. 全局 recovery 也可能返回 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - APIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyInput'
        description: 完整替换输入, schema 不强制任何属性. 业务上应提供目标 id 和所有希望保留的配置, 但 id 缺失不是 binding 校验错误. 省略或宽松解析为零值的标量可能覆盖原配置, api_key 始终保留原值.
  /api/v1/channel/create:
    post:
      operationId: createChannel
      summary: 创建渠道并触发辅助处理
      description: '继承根级 JWTAuth. Auth 先于 RequireJSON 执行. ShouldBindJSON 直接绑定 Channel 实体, 无 binding required, 没有 HTTP 层名称非空, URL 格式, key 非空或枚举范围手动校验. 唯一显式配置格式校验是 param_override: nil 或空白字符串通过, 其余字符串必须能反序列化到 map, JSON object 和字符串内容 null 均通过, 数组或普通标量失败. 不校验对象内参数语义. op 直接 GORM Create, GORM 标签不是请求约束. 成功后填充 stats, 另启 goroutine 执行价格补充, URL 延迟探测和自动分组, 最长使用 5 分钟上下文. 响应不代表这些辅助操作已经成功. keys 和 stats 等实体属性未被请求 DTO 剔除, 实际关联写入效果由 GORM 和数据库决定. RequireJSON 失败返回 415. 源码: internal/server/handlers/channel.go:73-98, internal/server/handlers/param_override.go:15-24, internal/op/channel.go:29-40.'
      parameters: []
      responses:
        '200':
          description: 已创建渠道, 含主动填充的 stats 和未脱敏 keys. 辅助任务仍可能执行中.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: 缺少 Authorization, JSON 绑定失败, 或 param_override 字符串无法反序列化为 map. 对应 message 为 Invalid request parameters, Invalid JSON format 或 param_override must be a valid JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type 未包含大小写敏感的 application/json 子串. RequireJSON 不检查 JSON 内容; 语法错误由接口解析处理. 有鉴权的路由先执行鉴权, 公开登录不要求先认证.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ChannelCreate 返回的数据库或关联写入错误直接作为 message. 全局 recovery 也可能返回 500. 不存在独立的 HTTP 409 分支.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
        description: 渠道实体 JSON. 所有实体属性在解析层都可省略. 非指针标量的 JSON null 可能保留 Go 零值, 不作为规范标量类型扩展. nil 切片和指针允许 null. enabled 的 GORM default:true 不被建模为 HTTP 默认值, 不能仅凭请求省略或 false 承诺最终持久化值.
  /api/v1/channel/delete/{id}:
    delete:
      operationId: deleteChannel
      summary: 删除渠道及关联数据
      description: '继承根级 JWTAuth. RequireJSON 对 DELETE 直接放行, 不要求 Content-Type, 不解析 body. id 使用 strconv.Atoi, 没有正数检查. op 要求渠道在缓存中存在, 在事务中删除引用该渠道的 GroupItem, 渠道 keys, StatsChannel 和渠道, 提交后清理缓存并刷新受影响分组. 受影响分组缓存刷新失败只记日志, 不改变已返回的 op 成功. 成功省略 data, 不是 data:null. 源码: internal/server/handlers/channel.go:144-155, internal/op/channel.go:263-334.'
      parameters:
        - name: id
          in: path
          required: true
          description: 渠道 ID. 路径文本必须能转换为 Go int, 没有正数范围校验. 零或负值通常在缓存查找后返回 500.
          schema:
            type: integer
      responses:
        '200':
          description: 通常删除渠道及关联数据后省略 data. op 内部 recover 可能回滚事务后仍返回 nil error, 此异常分支也返回成功包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccess'
        '400':
          description: 缺少 Authorization 时返回 Invalid request parameters. id 无法被 strconv.Atoi 转换时返回 Invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
