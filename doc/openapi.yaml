                properties:
                  data:
                    type: array
                    items:
                      type: string
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: 缺少 Authorization 时返回 Invalid request parameters. ShouldBindJSON 失败返回 Invalid JSON format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
