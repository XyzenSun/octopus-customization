        '415':
          description: RequireJSON 拒绝 Content-Type, 或指定渠道上游 HTTP 415
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ResponsesProtocolError'
        '500':
          description: 本地读取, 解压, 非校验转换或 recovery 失败, 或指定渠道上游 HTTP 500
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ResponsesProtocolError'
        '502':
          description: 分组最终失败, 直连网络或转换等真实尝试失败, 或指定渠道上游 HTTP 502
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ResponsesProtocolError'
        '503':
          description: 无启用候选, 直连渠道禁用, 无可用 Key, 无有效 BaseURL, 不兼容或熔断, 或指定渠道上游 HTTP 503
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ResponsesProtocolError'
        default:
          description: 其他上游状态, 包括协议直通保留的非 200 成功状态及指定渠道转换后的其他 HTTP 错误. 不一概表示错误. body 和 Content-Type 可能来自直通上游.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ResponsesResponse'
                  - $ref: '#/components/schemas/PassthroughJSON'
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ResponsesProtocolError'
            '*/*':
              schema:
                description: 直通成功可保留空 body 或其他未建模内容.
      tags:
        - Relay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      security:
        - APIKeyHeader: []
        - APIKeyBearer: []
security:
  - JWTAuth: []
components:
  schemas:
    APIKey:
      type: object
      required:
        - id
        - name
        - api_key
        - enabled
      properties:
        expire_at:
          type: integer
          format: int64
          description: Unix 秒过期时间, 无范围校验. 鉴权仅在值大于 0 且小于当前 Unix 秒时拒绝, 非正值不限制. update 漏传保存 0.
        max_cost:
          type: number
          format: double
          description: 最大消费额度, 无非负校验. 鉴权仅在大于 0 且小于累计输入加输出费用时拒绝, 等于上限仍放行, 非正值不限制. update 漏传保存 0.
        supported_models:
          type: string
          description: 逗号分隔的允许模型文本, 无格式或正则校验. 空字符串不限制. relay 按逗号拆分精确匹配且不 trim, stats 展示逻辑会 trim 并与 Group 名称取交集. update 漏传保存空字符串.
        id:
          type: integer
          description: 主键. create 未剔除客户端 ID. update 缺失/0/不存在通常返回 500, 不是 binding required 400.
        name:
          type: string
          description: 密钥名称, 没有 HTTP 非空或长度校验. update 漏传会写空字符串.
        api_key:
          type: string
          description: 密钥文本. create 会被生成值覆盖, update 不更新此列并恢复原值.
        enabled:
          type: boolean
          description: 启用状态. create 的 GORM default:true 不声明为请求默认值. update 漏传得到 false 并完整保存.
      description: APIKey 管理响应. id, name, api_key 和 enabled 无 omitempty, 始终输出. expire_at=0, max_cost=0 和 supported_models 为空时省略, 不是输出 null; 非零负值仍可输出. api_key 不脱敏. stats 路径的 supported_models 是改写后的展示文本.
    APIKeyInput:
      type: object
      properties:
        id:
          type: integer
          description: 主键. create 未剔除客户端 ID. update 缺失/0/不存在通常返回 500, 不是 binding required 400.
        name:
          type: string
          description: 密钥名称, 没有 HTTP 非空或长度校验. update 漏传会写空字符串.
        api_key:
          type: string
          description: 密钥文本. create 会被生成值覆盖, update 不更新此列并恢复原值.
        enabled:
          type: boolean
          description: 启用状态. create 的 GORM default:true 不声明为请求默认值. update 漏传得到 false 并完整保存.
        expire_at:
          type: integer
          format: int64
          description: Unix 秒过期时间, 无范围校验. 鉴权仅在值大于 0 且小于当前 Unix 秒时拒绝, 非正值不限制. update 漏传保存 0.
        max_cost:
          type: number
          format: double
          description: 最大消费额度, 无非负校验. 鉴权仅在大于 0 且小于累计输入加输出费用时拒绝, 等于上限仍放行, 非正值不限制. update 漏传保存 0.
        supported_models:
          type: string
          description: 逗号分隔的允许模型文本, 无格式或正则校验. 空字符串不限制. relay 按逗号拆分精确匹配且不 trim, stats 展示逻辑会 trim 并与 Group 名称取交集. update 漏传保存空字符串.
      description: '直接绑定 APIKey 的输入实体, create/update 均无 binding required, 不添加任何属性 required. 标量 JSON null 的 Go 宽松解析仅在描述中记录, 不扩展规范标量类型. GORM not null/default 不作为 HTTP 约束. update 是完整替换, 漏传属性会按零值保存, 除 api_key 保留旧值. 源码: internal/model/apikey.go:3-11.'
    APIKeyStatsResponse:
      type: object
      required:
        - stats
        - info
      properties:
        stats:
          $ref: '#/components/schemas/StatsAPIKey'
          description: 当前密钥原始数值统计, 非前端格式化值.
        info:
          $ref: '#/components/schemas/APIKey'
          description: 当前密钥信息, api_key 原样输出, supported_models 已替换为可展示的分组名称集合.
      description: '当前 APIKey 统计复合载荷, 两个字段始终输出且非 null. stats 使用共享 StatsAPIKey 和 StatsMetrics 定义, info 的 supported_models 已按分组名称改写. 源码: internal/server/handlers/apikey.go:100-130.'
    AnthropicCacheControl:
      anyOf:
        - type: object
          properties:
            type:
              anyOf:
