      description: '入站及响应固定为 OpenAI Images 格式. 非空 x-api-key 优先于 Authorization, Key 必须属于 Octopus 且启用, 未过期, 累计成本未超过 max_cost. 不挂 RequireJSON. 使用有效 boundary 的 multipart, 解析器接受 multipart/ 前缀. JSON body 不受支持且通常返回 400, 不是入口 415. image 或 image[] 合计必须恰好一个带非空 filename 的图片文件. prompt trim 后非空则 400, mask 即使被解析也不用于变体请求. model 先 trim, 缺失或空默认 dall-e-2. 表单 stream trim 后大小写不敏感等于 true 则 400, 不支持 SSE. 文件 MIME 支持 PNG, JPEG, GIF, WebP. 单文件及普通字段默认 50 MiB, AXONHUB_MAX_IMAGE_FILE_SIZE 可调整, 总 body 固定解析限额 816 MiB, 文件 part 总计最多 16(含 mask 或未知字段), 限额在完整读入后校验, 通常 400 而非 413. OpenAI chat/responses/image 类渠道走 OpenAI variations, openai/responses 此时不是 Responses API. 工厂虽允许 Gemini 和 Doubao, 但两者 image outbound 必须有 prompt, 与此入站禁止 prompt 冲突, 标准转换路径不能完成 variation, 会以真实尝试失败处理. 完整 model 优先精确匹配 Group, 存在但无启用候选时 503 且不回退. 不存在且含 / 时按第一个 / 拆 channelName/modelName, 大小写严格, multipart 入站已 trim model, 只匹配渠道 Model/CustomModel 当前快照. supported_models 非空禁止实际直连, Group 白名单逗号拆分不 trim, 与 /v1/models 的 trim 不同. 直连仅一次指定渠道尝试, 无负载均衡, 故障转移, sticky, Group 超时或 Group 请求选项, 仍检查启用, Key, BaseURL 和熔断. Group 请求选项先应用, 渠道后覆盖, 参数覆盖只作用于最终 JSON body, 不能改写 OpenAI multipart body, Header 可覆盖或删除认证. 协议直通需开关, 相同入站和渠道 Type, 无适用请求选项, endpoint 有效且 multipart 不需要模型改写, 仍先解析和选路, 不等同直连. 直连去前缀或 Group 模型改名通常退回转换. 直通保留成功 body, status 和 Header, 直接拼 BaseURL 与 endpoint, 不做普通版本规范化. 本地错误及分组最终失败为 ErrorResponse, 分组最终失败 502. 仅直连可识别的上游 HTTP 错误保留状态并转 OpenAIProtocolError, 无 HTTP 状态的真实尝试失败 502, 不可用或跳过 503. Group 路由按 mode 排序候选并在配置允许时让可用 sticky 渠道优先, 尚未写出响应时可顺次尝试或故障转移. 尝试结果记录于 RelayLog.Attempts 并统计, 日志持久化受设置影响. Authorization 通常使用 Bearer <key>, 实现也接受直接 key, 仅剥离精确的 Bearer 加一个空格, 不额外 trim 或读取 Cookie/query 凭证. 来源: internal/server/server.go:65, axonhub pin d061ac7df6ae transformer/openai/image_inbound.go:323-371, transformer/gemini/image.go:19-29, transformer/doubao/outbound.go:190-198.'
      parameters: []
      responses:
        '200':
          description: 普通转换的非流式 Images JSON, 无管理包装. 非流式直通可能保留其他 JSON, Content-Type 或空 body.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ImageResponse'
                  - $ref: '#/components/schemas/PassthroughJSON'
            '*/*':
              schema:
                $ref: '#/components/schemas/PassthroughBody'
        '400':
          description: multipart, 图片数量, prompt, stream 或白名单校验失败, 或指定渠道上游 HTTP 400
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '401':
          description: Octopus API Key 缺失, 无效, 禁用, 过期或超成本, 或指定渠道上游 HTTP 401
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '404':
          description: 本地模型或直连渠道不存在, 或指定渠道上游 HTTP 404
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '500':
          description: 本地读取, 解压, 非校验转换或 recovery 失败, 或指定渠道上游 HTTP 500
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '502':
          description: 分组最终失败, 直连网络或转换等真实尝试失败, 包括 Gemini/Doubao variation 的 prompt 冲突, 或指定渠道上游 HTTP 502
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        '503':
          description: 无启用候选或直连目标不可用, 不兼容, 熔断, 或指定渠道上游 HTTP 503
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
        default:
          description: 其他上游状态, 包括协议直通非 200 成功及直连其他 HTTP 错误(例如上游 415), 不一概表示错误. 本入口没有 RequireJSON 的本地 415, 不支持 SSE.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ImageResponse'
                  - $ref: '#/components/schemas/PassthroughJSON'
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OpenAIProtocolError'
            '*/*':
              schema:
                description: 直通成功可以保留原始或空 body 及其他 Content-Type.
      tags:
        - Relay
      requestBody:
        required: true
        description: multipart 图片文件及文本参数. 只允许一个 image, 标准 MIME 为 multipart/form-data, 其他 multipart/ MIME 也需有效 boundary.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageVariationRequest'
            encoding:
              image:
                contentType: image/png, image/jpeg, image/gif, image/webp
              image[]:
                contentType: image/png, image/jpeg, image/gif, image/webp
      security:
        - APIKeyHeader: []
        - APIKeyBearer: []
  /v1/messages:
    post:
      operationId: relayAnthropicMessages
      summary: 转发 Anthropic Messages 请求
      description: '入站及客户端响应协议固定为 Anthropic Messages, 与鉴权头无关. 非空 x-api-key 优先于 Authorization, Key 必须属于 Octopus 且启用, 未过期, 累计成本未超过 max_cost. RequireJSON 只检查 Content-Type 包含小写 application/json. model, messages 和正 max_tokens 在入站执行校验, thinking, system 及 tool_choice 另有明确规则. 可选择 openai/chat_completions, openai/responses, anthropic/messages, gemini/contents 或 doubao 出站, 不保证跨协议所有多模态和原生工具字段无损. Anthropic-Version 入站未强制必填, Anthropic 出站缺省为 2023-06-01, 可受允许合并的入站 Header 或请求选项影响. stream:true 返回 Messages SSE, Group 正 first_token_time_out 才设置首事件超时, 写出后不重试. 完整 model 优先精确命中 Group, 存在但无启用候选时返回 503 且不回退. Group 不存在且 model 含 / 时按第一个 / 解析 channelName/modelName, 选路大小写严格且不 trim, 模型只取渠道 Model/CustomModel 当前快照. supported_models 非空禁止实际直连, Group 白名单按逗号拆分但不 trim, 不同于 /v1/models 的 trim. 直连只尝试指定渠道一次, 不用负载均衡, 故障转移, sticky, Group 超时或 Group 请求选项, 仍检查渠道启用, Key, BaseURL 和熔断. Group 请求选项先应用, 渠道后覆盖, JSON 顶层 null 删除参数, Header 可覆盖或删除认证头. 协议直通需开关, 相同入站和渠道 Type, 无适用请求选项且 endpoint 有效, 仍先解析和选路, 可改 JSON model, 不等同指定渠道直连. 非流式直通保留成功 body, status 和 Header. 流式直通保留解析后的 data 和 event/id, 由 Octopus 重新编码 SSE 并使用本地响应头与 200 状态, 不保留原始字节或全部上游 Header. endpoint 直接拼 BaseURL, 不做普通版本规范化. 本地错误及分组最终失败为 ErrorResponse, 分组最终失败为 502. 仅直连可识别上游 HTTP 错误保留状态并转换为 AnthropicProtocolError, 顶层 type 来自统一错误类型而不固定为 error, 不是完整上游错误头或 body 透传. 无 HTTP 状态的真实尝试失败为 502, 不可用或跳过为 503. 流提交后的错误和客户端取消不保证另有 JSON. Group 路由按 mode 排序候选并在配置允许时让可用 sticky 渠道优先, 尚未写出响应时可顺次尝试或故障转移. 尝试结果记录于 RelayLog.Attempts 并统计, 日志持久化受设置影响. Authorization 通常使用 Bearer <key>, 实现也接受直接 key, 仅剥离精确的 Bearer 加一个空格, 不额外 trim 或读取 Cookie/query 凭证. 来源: internal/server/server.go:61, internal/relay/relay.go:42-177,287-603, internal/relay/direct_channel.go:90-117, axonhub pin d061ac7df6ae transformer/anthropic/inbound.go.'
      parameters:
        - name: Anthropic-Version
          in: header
          required: false
          description: 可选入站 Header, 本项目没有必填校验. 不选择客户端响应协议. Anthropic 出站通常设置 2023-06-01, 自定义 Header 仍可覆盖或删除.
          schema:
            type: string
          example: '2023-06-01'
        - name: Anthropic-Beta
          in: header
          required: false
          description: 可选 beta Header. Anthropic 出站允许合并此 Header, 实际功能由上游及转换能力决定.
          schema:
            type: string
      responses:
        '200':
          description: 普通转换的非流式 Messages JSON 或 SSE, 无管理包装. 非流式直通可能保留其他 JSON, Content-Type 或空 body.
          content:
            application/json:
              schema:
