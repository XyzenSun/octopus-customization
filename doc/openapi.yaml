      operationId: getCircuitStatus
      summary: 查询当前渠道级熔断条目
      description: '遍历进程内渠道级熔断器, 返回 Open 且冷却未过期的条目. 底层 key 为 channelID:keyID:modelName, 同一渠道可有多条相同名称的结果, 无排序或去重, 响应不含 key 或模型标识. 渠道名称不存在时回退 Channel#<id>. 秒数向下取整, 因而未过期条目也可为 0. 查询没有检查 circuit_breaker_enabled, 关闭开关仍可能展示旧条目. 查询会把冷却到期的 Open 改为 HalfOpen 并隐藏, HalfOpen 也隐藏. 静态风险: IsTripped 只在自己完成 Open 到 HalfOpen 时放行一次, 已经 HalfOpen 时拒绝; 查询提前转换可能在没有其他在途请求改变状态时阻断后续恢复试探. 不能宣称 HalfOpen 必然已允许试探通过. Source: internal/relay/balancer/circuit.go:35-39,111-142,213-280.'
      parameters: []
      responses:
        '200':
          description: '当前展示的熔断条目, 无条目为 data: []. 查询本身可改变熔断状态.'
