                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: 缺少 Authorization, JSON 绑定或顶层 id required 失败, 或 param_override 格式校验失败. 绑定失败统一返回 Invalid JSON format, 参数覆盖失败返回 param_override must be a valid JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type 未包含大小写敏感的 application/json 子串. RequireJSON 不检查 JSON 内容; 语法错误由接口解析处理. 有鉴权的路由先执行鉴权, 公开登录不要求先认证.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 渠道不在缓存时返回 channel not found. 数据库事务, 密钥操作, 提交或提交后缓存刷新失败返回 op 错误文本. 没有渠道不存在的 404 分支. 全局 recovery 也可能返回 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdateRequest'
        description: 增量 DTO. 顶层 id 必须提供且非零. 切片操作省略, null 或空数组均不执行对应操作. 不将嵌套 required 标签建模为已证实执行的约束.
