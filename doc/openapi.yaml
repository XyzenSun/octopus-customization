      description: '入站及响应固定为 OpenAI Images 格式. 非空 x-api-key 优先于 Authorization, Key 必须属于 Octopus 且启用, 未过期, 累计成本未超过 max_cost. 不挂 RequireJSON. 使用带 boundary 的 multipart, 解析器接受 multipart/ 前缀, JSON body 不受支持且通常返回 400, 不是入口 415. 至少提供 image 或 image[] 文件 part, filename 必须非空, prompt trim 后非空. model 先 trim, 缺失或空时默认 dall-e-2. 表单 stream trim 后大小写不敏感等于 true 则 400, 不支持 SSE. 文件 MIME 支持 PNG, JPEG, GIF, WebP, 单文件及普通字段默认 50 MiB, AXONHUB_MAX_IMAGE_FILE_SIZE 可调整. 总 body 固定解析限额 816 MiB, 最多 16 个文件 part, 包括 mask 和未知文件字段. 限额在完整 body 读入后校验, 不是入口读流限额, 超限通常 400 而非 413. 可选择 OpenAI chat/responses/image 类渠道, Gemini 或 Doubao, openai/responses 此时仍用 Images outbound. Gemini 和 Doubao 不完整保留 mask 及其他 OpenAI 参数, 不保证无损. 完整 model 优先精确匹配 Group, 存在但无启用候选时 503 且不回退. 不存在且含 / 时按第一个 / 拆 channelName/modelName, 选路大小写严格, multipart 入站已 trim model, 只匹配渠道 Model/CustomModel 当前快照. supported_models 非空禁止实际直连, Group 白名单按逗号拆分不 trim, 与 /v1/models 的 trim 不同. 直连仅一次指定渠道尝试, 不用负载均衡, 故障转移, sticky, Group 超时或 Group 请求选项, 仍检查启用, Key, BaseURL 和熔断. Group 请求选项先应用, 渠道后覆盖, 参数覆盖仅作用于最终 JSON body, 不能改写 OpenAI multipart body, Header 可覆盖或删除认证头. 协议直通需开关, 相同入站和渠道 Type, 无适用请求选项, endpoint 有效且 multipart 不需要模型改写, 仍先解析和选路, 不等同直连. 直连去前缀或 Group 模型改名通常使 multipart 退回转换. 直通保留成功 body, status 和 Header, endpoint 直接拼 BaseURL 而不做普通版本规范化. 本地错误及分组最终失败为 ErrorResponse, 分组最终失败 502. 仅直连可识别上游 HTTP 错误保留状态并转 OpenAIProtocolError, 无 HTTP 状态的真实尝试失败 502, 不可用或跳过 503. Group 路由按 mode 排序候选并在配置允许时让可用 sticky 渠道优先, 尚未写出响应时可顺次尝试或故障转移. 尝试结果记录于 RelayLog.Attempts 并统计, 日志持久化受设置影响. Authorization 通常使用 Bearer <key>, 实现也接受直接 key, 仅剥离精确的 Bearer 加一个空格, 不额外 trim 或读取 Cookie/query 凭证. 来源: internal/server/server.go:64, internal/relay/passthrough.go:37-54, axonhub pin d061ac7df6ae transformer/openai/image_inbound.go:252-321,389-483.'
      parameters: []
      responses:
        '200':
