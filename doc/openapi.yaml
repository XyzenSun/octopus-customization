        '401':
          description: 用户名或密码不匹配, TOTP 无效, 或 TOTP 登录处于锁定期. message 均为 Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type 未包含大小写敏感的 application/json 子串. RequireJSON 不检查 JSON 内容; 语法错误由接口解析处理. 有鉴权的路由先执行鉴权, 公开登录不要求先认证.
          content:
