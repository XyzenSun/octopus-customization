          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Setting
  /api/v1/setting/import:
    post:
      operationId: importDatabase
      summary: 增量导入数据库数据
      description: '不使用 RequireJSON. Content-Type 大小写敏感地包含 multipart/form-data 时读取文件字段 file, 其他 Content-Type 或缺失头均把原始 body 作为 JSON 解码. application/octet-stream 仅代表其他媒体类型的直接 JSON 路径, 不是限定只接受这里列出的媒体类型. 文件后缀和 part MIME 不做业务校验, handler 使用 io.ReadAll 且没有显式大小限制. 先按裸 DBDump 解码; 仅 version 为 0 且 channels, groups, group_items, settings, api_keys, llm_infos, relay_logs 和全部六种 stats 数组长度都为 0 时尝试 wrapper. 该条件漏查 channel_keys, 也不检查 exported_at 或 include 标志. wrapper 的 code 和 message 不必提供, 不检查 code 为 200; wrapper 自身解码错误被忽略, 只有成功读到 data 才再解到同一个 dump, 未覆盖的顶层字段可能保留. 非零顶层 version 或非空受检查数组会阻止解包, 只兼容一层 wrapper. 例如 code 为字符串可使 data 被忽略而按空 dump 成功. 裸 {}, null 或 data: null 可进行空导入, 未知字段被忽略. anyOf 仅记录兼容形态, 不是严格的解包判定或互斥校验. version 仅允许 0 或 1, 缺失和 null 进入零值; 其他 version 返回 400. 所有表操作在一个事务内, channels, channel_keys, groups, group_items, api_keys 和启用的 relay_logs 按冲突 DoNothing 插入; llm_infos 按 name UpdateAll; settings 按 key 更新 value 并过滤 two_factor_enabled; stats 按各实体主键 UpdateAll, stats_hourly 仅按 hour 而非 date+hour. 缺失或空数组不删除旧数据, 冲突不重映射 ID 或关联. include_logs 和 include_stats 控制顶层可选表操作, 默认 false. 导入不走常规创建校验或 Setting.Validate, 不先保存运行缓存, 也不重调度任务. 提交后 InitCache 的错误被忽略, 仍可能返回 200, 刷新可覆盖未落库增量. Source: internal/server/handlers/setting.go:105-186; internal/op/backup.go:79-221; internal/op/cache.go:9-29.'
      parameters: []
      responses:
        '200':
          description: 逐表受影响行数, 不是稳定的新增行数. 缓存刷新成功不由该响应保证.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/DBImportResult'
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: "缺少 Authorization, multipart 缺少或无法读取 file, body 读取或 JSON 解码失败, 不支持的 version, 或数据库导入事务失败. 数据库业务错误在此也映射为 400, 不是 500. multipart 缺少文件分支 message 为 missing upload file field 'file'. Source: internal/server/handlers/setting.go:108-145."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 接口内部错误或全局 panic recovery. 错误原因以 message 为准, 当前实现可能将资源不存在等错误映射为 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Setting
      requestBody:
        required: true
        description: 裸 JSON, 条件式响应 wrapper 或 multipart 文件. 允许 JSON null, 空 body 则解码失败. 实际媒体类型判断是子串分支而非严格枚举.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DBDumpImportBody'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/DBDumpImportBody'
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: JSON 文件内容, 支持与直接 body 相同的条件式 wrapper, 不校验后缀或 part MIME.
