  /api/v1/log/list:
    get:
      operationId: listRelayLogs
      summary: 分页查询转发日志
      description: '先按时间条件筛选内存缓存, 再反转缓存追加顺序并分页. 启用 relay_log_keep_enabled 时, 不足部分从数据库按 id DESC 补足; 关闭时不读取数据库历史日志. 不是缓存和数据库整体按 time 排序, 也不是原子快照. 不返回总数或 has_more. 普通越界页返回 data: null. page 没有业务上限, offset 计算未检查整数溢出, 极大值存在触发 recovery 500 的风险. Source: internal/server/handlers/log.go:39-74; internal/op/log.go:273-335.'
      parameters:
        - name: page
          in: query
          description: 缺失时默认为 1. 使用 strconv.Atoi 解析, 错误被忽略; 普通非数字输入解析为 0 后回退为 1, 小于 1 也回退为 1. 没有业务最大值, 整数解析范围取决于编译架构. 不应理解为非法输入返回 400.
          schema:
            type: string
            default: '1'
        - name: page_size
          in: query
          description: 缺失时默认为 20. 使用 strconv.Atoi 解析, 错误被忽略. 小于 1 或大于 100 时回退为 20, 不是钳制到 1 或 100, 也不返回 400.
          schema:
            type: string
            default: '20'
        - name: start_time
          in: query
          description: Unix 秒的整数文本. 仅当 start_time 和 end_time 都非空时才解析和启用过滤, 此时任一解析失败返回 400. 只有一端非空时整个过滤被忽略, 不校验已提供值. 闭区间, 不校验非负或起止顺序, Go int 范围取决于编译架构.
          schema:
            type: string
        - name: end_time
          in: query
          description: Unix 秒的整数文本. 必须与非空 start_time 同时提供才生效. 过滤为 start_time <= time <= end_time, 倒置区间不会被拒绝, 通常返回空结果.
          schema:
            type: string
      responses:
        '200':
          description: 日志列表. 无结果时 data 为 null, 不是省略 data 或固定空数组.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ListRelayLogsStatus200application_jsonDataValue'
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
        '400':
          description: '缺少 Authorization, 或两端时间均非空时任一时间无法解析为 Go int. 分页参数非法或越界本身不返回此状态. Source: internal/server/middleware/auth.go:17-21; internal/server/handlers/log.go:52-63.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT 校验失败, 或 API Key 无效, 禁用, 过期, 累计成本超过正额度上限. 返回 Octopus 错误包装.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 接口内部错误或全局 panic recovery. 错误原因以 message 为准, 当前实现可能将资源不存在等错误映射为 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Log
  /api/v1/log/stream:
    get:
      operationId: streamRelayLogs
      summary: 订阅实时转发日志
      description: '由 StreamToken 安全方案表达 query token, 不要求 JWT. 缺失, 未知或已吊销 token 返回 401 JSON. token 没有 TTL, 校验和吊销不是原子消费, 并发连接可能同时通过. 校验后立即吊销, 后续连接失败也不能重用. 每帧为 data: <RelayLog JSON> 后接两个换行, 不使用成功包装. 无初始事件, 心跳, event, id, retry, 回放或断点续传, 只推送订阅后的日志. 每订阅缓冲 10 条, 满时静默丢帧; marshal 失败跳过该帧, Write 错误被忽略, 不发送结构化 SSE 错误. 日志通知为异步且可早于数据库写入, 不保证顺序或可靠持久化. 首条日志前没有主动 Write 或 Flush, 响应头何时被客户端或代理观察到未做运行确认. 客户端 context 结束后退订. Source: internal/server/handlers/log.go:94-129; internal/op/log.go:33-87,137-181.'
      parameters: []
      responses:
        '200':
          description: 持续 SSE 文本流. 每条 data 载荷符合 RelayLog, 不含统一响应包装.
          headers:
            Cache-Control:
              required: false
              description: 禁用缓存.
              schema:
                type: string
                enum:
                  - no-cache
            Connection:
              required: false
              description: handler 设置的连接头, 实际代理或协议层可能改变它.
              schema:
                type: string
                enum:
                  - keep-alive
            X-Accel-Buffering:
              required: false
              description: 请求反向代理禁用响应缓冲.
              schema:
                type: string
                enum:
                  - 'no'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamRelayLogsStatus200text_event_streamValue'
        '401':
          description: token 缺失, 未知或已吊销. message 为 invalid stream token, 返回 JSON 而非 SSE 帧.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 接口内部错误或全局 panic recovery. 错误原因以 message 为准, 当前实现可能将资源不存在等错误映射为 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Log
      security:
        - StreamToken: []
